<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belegarchiv – Testversion</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Belege">
<meta name="theme-color" content="#1E3A8A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6EEDC; --surface:#FFFCF6; --ink:#111111; --muted:#5A5246; --line:#E3D7BD;
  --gold-hover:#DDA600; --gold-edge:#B88A00;
  --sign:#F2B705; --sign-ink:#1B2430; --ok:#1F7A4D; --ok-bg:#E2F3EA; --bad:#B42318; --bad-bg:#FDE7E5;
  --wait:#7A5B00; --wait-bg:#FFF3C9; --focus:#2563EB; --primary:#F2B705; --primary-ink:#111111;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171D; --surface:#1B232C; --ink:#E7ECEF; --muted:#9AA6B2; --line:#2C3743;
    --sign:#F2B705; --sign-ink:#12171D; --ok:#5BD49A; --ok-bg:#163326; --bad:#FF8A80; --bad-bg:#3A1B1A;
    --wait:#F5CF5B; --wait-bg:#352B0C; --focus:#7AA7FF; --primary:#F2B705; --primary-ink:#111111; --gold-hover:#FFC926; --gold-edge:#F2B705; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171D; --surface:#1B232C; --ink:#E7ECEF; --muted:#9AA6B2; --line:#2C3743;
  --sign:#F2B705; --sign-ink:#12171D; --ok:#5BD49A; --ok-bg:#163326; --bad:#FF8A80; --bad-bg:#3A1B1A;
  --wait:#F5CF5B; --wait-bg:#352B0C; --focus:#7AA7FF; --primary:#F2B705; --primary-ink:#111111; --gold-hover:#FFC926; --gold-edge:#F2B705; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6}
html[lang="fa"] body, html[lang="ar"] body{font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;line-height:1.75}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin:8px 0 20px;flex-wrap:wrap}
.roof{background:var(--sign);color:var(--sign-ink);font-weight:800;font-size:13px;letter-spacing:.04em;
  padding:6px 14px 4px;border-radius:10px 10px 3px 3px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
h1{font-size:22px;margin:0;font-weight:800;flex:1;min-width:200px}
h2{font-size:17px;margin:0 0 10px;font-weight:800}
.lang{display:flex;gap:4px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface)}
.lang button{background:transparent;color:var(--muted);padding:5px 10px;font-size:13px;border-radius:7px;border:0}
.lang button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
p.hint{color:var(--muted);margin:0 0 12px;font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=file]{padding:8px}
button{font:inherit;font-weight:700;border:1px solid var(--gold-edge);border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--primary);color:var(--primary-ink)}
button:not(:disabled):hover{background:var(--gold-hover)}
button.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--gold-edge)}
button.secondary:not(:disabled):hover{background:var(--wait-bg)}
.lang button:not([aria-pressed="true"]):hover, .viewnav .tab:not(.active):hover, .kindseg button:not([aria-pressed="true"]):hover{background:var(--wait-bg)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;display:none}
.msg.show{display:block}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.msg.info{background:var(--wait-bg);color:var(--wait)}
ol.steps{margin:12px 0 0;padding-inline-start:22px;font-size:14px}
ol.steps li{color:var(--muted)}
ol.steps li.done{color:var(--ok)}
ol.steps li.fail{color:var(--bad);font-weight:700}
ol.steps li.run{color:var(--ink);font-weight:700}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.titlebox{flex:1;min-width:200px;display:grid;gap:2px}.titlebox h1{flex:none;min-width:0}
.welcome{font-size:15px;color:var(--ink);font-weight:600}
.welcome button{margin-inline-start:8px}
.hdrright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button.small{padding:6px 12px;font-size:14px;border-radius:8px;min-height:36px}
button.logout{background:#B42318;border-color:#B42318;color:#fff;font-weight:700}
button.logout:not(:disabled):hover{background:#912018}
.langsel{min-height:36px;padding:6px 10px;border-radius:8px;font:inherit;font-size:14px;border:1.5px solid var(--gold-edge);background:var(--surface);color:var(--ink)}
.toolbar button{background:#6B4423;border-color:#6B4423;color:#fff;font-weight:700}
.toolbar button:not(:disabled):hover{background:#54351B}
.invcode.ltr{text-align:center!important}
/* 2026-11-05: aufgeräumtes Layout */
header.topbar{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;margin-bottom:14px}
header.topbar .roof{flex:none}
header.topbar .titlebox{flex:1;min-width:0}
header.topbar h1{font-size:19px;line-height:1.25;margin:0;white-space:normal}
header.topbar .hdrright{flex:none;display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
header.topbar .langsel{min-height:36px;padding:4px 6px;font-weight:700;width:auto}
header.topbar button.logout{min-height:36px;padding:6px 10px;font-size:13px}
.hero{display:grid;gap:14px;padding:18px}
.hero .welcome{display:grid;gap:2px}
.hero .welcome .hi{font-size:14px;font-weight:600;color:var(--muted)}
.hero .welcome .nm{font-size:22px;font-weight:800;color:var(--ink);line-height:1.2}
.hero .welcome .co{font-size:14px;color:var(--muted)}
.hero .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.hero .act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:6px 4px;
  background:#6B4423;border:1px solid #6B4423;color:#fff;border-radius:12px;font-size:12px;font-weight:700;line-height:1.15;text-align:center}
.hero .act:not(:disabled):hover{background:#54351B}
.hero .act .ic{font-size:17px;line-height:1}
#bizInfo{display:none!important}
#mainView{display:flex;flex-direction:column}
#mainView > #subBanner{order:1} #mainView > #uploadBox{order:2} #mainView > #listBox{order:3}
#mainView > #twBox{order:4} #mainView > #profBox{order:5} #mainView > #delBox{order:6}
#mainView > #profBox:has(#profForm:not(.hidden)){order:0}
.subbanner{flex-wrap:nowrap}.subbanner span{flex:1;min-width:0}.subbanner button{flex:none}
@media (max-width:380px){ header.topbar h1{font-size:17px} .hero .act{font-size:12px} }
.welcome .hi{font-size:16px;font-weight:700}.welcome .nm{font-size:15px;font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
section:has(> .toolbar){padding:8px 10px;background:transparent;border:0;margin-bottom:8px}
.subbanner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-weight:600;font-size:15px}
.subbanner.info{background:var(--wait-bg);color:var(--wait);border:1px solid var(--gold-edge)}
.subbanner.warn{background:#FFE8CC;color:#7A3E00;border:1px solid #D98A2B}
.subbanner.ro{background:#FDE7E7;color:#8A1C1C;border:1px solid #D45555}
button:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--ink);text-decoration:underline;padding:8px 0;font-weight:600;font-size:14px;min-height:0}
.linkbtn:not(:disabled):hover{background:none;color:var(--muted)}
a.linkbtn{display:block;margin-top:2px}
.invbox{display:grid;gap:10px}.invbox .lbl{font-size:13px;color:var(--muted)}
.invcode{font-size:30px;font-weight:800;letter-spacing:4px;background:var(--wait-bg);border:1.5px dashed var(--gold-edge);border-radius:10px;padding:10px;text-align:center}
.invlink{font-size:13px;word-break:break-all;color:var(--muted)}
.captcha{margin:12px 0 4px;min-height:65px}
.doc{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:6px}
.doc:first-child{border-top:0}
.doc .name{font-weight:700;word-break:break-all}
.doc .meta{font-size:13px;color:var(--muted)}
.doc .actions{display:flex;gap:8px;flex-wrap:wrap}
.doc .actions button{padding:6px 12px;font-size:13px}
.chip{justify-self:start;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px}
.chip.verified{background:var(--ok-bg);color:var(--ok)}
.chip.unverified{background:var(--wait-bg);color:var(--wait)}
.chip.MISMATCH{background:var(--bad-bg);color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip.entwurf{background:transparent;color:var(--muted);border:1px solid var(--line)}
.chip.erfasst{background:var(--ink);color:var(--surface)}
.chip.pkg{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.chip.storno{background:transparent;color:var(--bad);border:1px solid var(--bad)}
details.done{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.done > summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:24px}
details.done > summary::-webkit-details-marker{display:none}
details.done > summary::after{content:"▾";color:var(--muted)}
details.done[open] > summary::after{content:"▴"}
details.done .donelist{display:grid;gap:10px;padding:0 10px 12px}
details.done .doc{opacity:.85}
.doc .warn{font-size:13px;color:var(--wait);background:var(--wait-bg);padding:6px 10px;border-radius:8px}
.doc .actions button.danger{color:var(--bad);border-color:var(--bad)}
.doc button.record{background:var(--primary);color:var(--primary-ink);font-size:17px;padding:14px 32px;border-radius:12px;justify-self:start;margin-top:4px}
.chip.ai{background:var(--wait-bg);color:var(--wait)}
.chip.confirmed{background:var(--ok-bg);color:var(--ok)}
.review{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--bg)}
.review .rhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.review .hint{margin:0}
.fld label{margin:0 0 4px}
.fld.unsure input,.fld.unsure select{border-color:var(--wait);background:var(--wait-bg)}
.fld.unsure > label:not(.chk)::after{content:" ?";color:var(--wait)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kindseg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.kindseg button{border:0;border-radius:0;background:transparent;color:var(--ink);padding:10px 6px;font-weight:700;min-height:44px}
.kindseg button + button{border-inline-start:1.5px solid var(--line)}
.kindseg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.kbox{border-radius:10px;padding:10px 12px;background:var(--wait-bg);color:var(--wait);display:grid;gap:8px;font-size:14px}
.kbox .tip{font-size:13px;opacity:.9}
.vline{display:grid;grid-template-columns:76px 1fr 1fr 74px 36px;gap:6px;align-items:center;margin-bottom:6px}
.vline.vhead{font-size:12px;color:var(--muted);margin-bottom:2px}
.vline input,.vline select{padding:8px}
.vline .net{font-size:13px;color:var(--muted)}
.lwarn{font-size:12px;color:var(--wait);margin:-2px 0 6px}
.lwarn:empty{display:none}
.total{font-weight:700;margin-top:6px}
button.small{padding:6px 10px;font-size:13px}
button.ai{background:var(--primary);color:var(--primary-ink)}
.summary{display:grid;gap:4px;border-inline-start:3px solid var(--ok);padding-inline-start:10px}
.summary .sline{font-weight:700}
.summary .chip{justify-self:start}
@media (max-width:480px){.grid2{grid-template-columns:1fr}.vline{grid-template-columns:64px 1fr 1fr 34px}.vline .net{display:none}.vline.vhead span:nth-child(4){display:none}}
.twcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.tscroll{overflow-x:auto;max-width:100%}
.twtable{border-collapse:collapse;font-size:13px;min-width:300px;width:100%}
.twtable th,.twtable td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.twtable .num{text-align:end;font-variant-numeric:tabular-nums}
.fnd{font-size:13px;padding:7px 10px;border-radius:8px}
.fnd summary{cursor:pointer}
.fnd.warn{background:var(--wait-bg);color:var(--wait)}
.fnd.error{background:var(--bad-bg);color:var(--bad)}
.fnd.info{border:1px solid var(--line);color:var(--muted)}
.fnd.ok{background:var(--ok-bg);color:var(--ok)}
.fnd .ex{font-size:12px;margin-top:4px;word-break:break-word;opacity:.9}
.chip.tw-ok{background:var(--ok-bg);color:var(--ok)}
.chip.tw-warnings{background:var(--wait-bg);color:var(--wait)}
.chip.tw-failed{background:var(--bad-bg);color:var(--bad)}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:2px 0}
.chk input{width:auto;margin:0}
button.camera{width:100%;background:var(--primary);color:var(--primary-ink);font-size:18px;padding:16px;border-radius:12px;margin:6px 0 2px}
.chk.mini{font-size:13px;margin-top:4px;color:var(--wait)}
.fld.unsure.ok input,.fld.unsure.ok select{border-color:var(--ok);background:var(--ok-bg)}
.fld.unsure.ok > label:not(.chk)::after{content:" ✓";color:var(--ok)}
.fld.unsure.ok .chk.mini{color:var(--ok)}
.warn-text{color:var(--wait);margin:0}
.viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) 12px max(16px, env(safe-area-inset-bottom, 0px))}
.vbox{background:var(--surface);color:var(--ink);border-radius:14px;width:min(900px,100%);max-height:100%;overflow:auto;padding:14px;display:grid;gap:10px}
.vbox img{max-width:100%;height:auto;border-radius:8px;display:block}
.vclose{justify-self:end;position:sticky;top:0;padding:6px 12px}
.btnlink{display:inline-block;justify-self:start;padding:10px 14px;border-radius:10px;background:var(--primary);color:var(--primary-ink);text-decoration:none;font-weight:600}
.viewnav{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;position:sticky;top:env(safe-area-inset-top, 0px);z-index:5}
.viewnav .tab{flex:1;background:transparent;color:var(--ink);border:0;padding:10px;border-radius:9px;font-weight:600}
.viewnav .tab.active{background:var(--primary);color:var(--primary-ink)}
.dhead{display:flex;gap:12px;align-items:flex-start}
.dinfo{display:grid;gap:4px;min-width:0;flex:1}
.dinfo .name{overflow-wrap:anywhere}
button.thumb{flex:0 0 auto;width:72px;height:72px;padding:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center}
button.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ticon{font-size:30px}
button.rimg{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);max-height:340px;display:flex;justify-content:center}
button.rimg img{max-width:100%;max-height:340px;object-fit:contain;display:block}
.hint.center{text-align:center;margin:-4px 0 0;font-size:12px}
.hash{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--muted);word-break:break-all}
.ltr{direction:ltr;text-align:start}
html[dir="rtl"] .ltr{text-align:right}
.hidden{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <header class="topbar">
    <span class="roof">TAXI</span>
    <div class="titlebox"><h1 data-i18n="title"></h1></div>
    <div class="hdrright">
      <select id="langSel" class="langsel" aria-label="Sprache / Language">
        <option value="de">DE</option>
        <option value="en">EN</option>
        <option value="fa">FA</option>
        <option value="ar">AR</option>
      </select>
      <button id="btnLogout" class="secondary small logout hidden" data-i18n="b_logout"></button>
    </div>
  </header>

  <section id="authBox">
    <h2 data-i18n="h_login"></h2>
    <p class="hint" data-i18n="login_hint"></p>
    <div id="signupFields" class="hidden">
      <div class="grid2">
        <div><label for="suFirst" data-i18n="l_first"></label><input id="suFirst" autocomplete="given-name" maxlength="60"></div>
        <div><label for="suLast" data-i18n="l_last"></label><input id="suLast" autocomplete="family-name" maxlength="60"></div>
      </div>
      <label for="suCompany" data-i18n="l_company"></label><input id="suCompany" autocomplete="organization" maxlength="200">
      <label for="suRef" data-i18n="l_ref"></label><input id="suRef" class="ltr" maxlength="12" autocapitalize="characters" placeholder="ABC123">
    </div>
    <label for="email" data-i18n="l_email"></label>
    <input id="email" type="email" autocomplete="email" class="ltr">
    <label for="password" data-i18n="l_password"></label>
    <input id="password" type="password" autocomplete="current-password" class="ltr">
    <div id="otpBox" class="hidden">
      <p class="hint" id="otpHint"></p>
      <label for="otpCode" data-i18n="l_otp"></label>
      <input id="otpCode" class="ltr" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123456">
      <div class="row"><button id="btnOtp" type="button" data-i18n="b_otp"></button><button id="btnOtpResend" type="button" class="secondary small" data-i18n="b_otp_resend"></button></div>
    </div>
    <div id="signupPw2" class="hidden"><label for="password2" data-i18n="l_password2"></label><input id="password2" type="password" autocomplete="new-password" class="ltr"></div>
    <div id="resetBox" class="hidden">
      <p class="hint" id="rsHint"></p>
      <div id="rsCodeRow"><label for="rsCode" data-i18n="l_otp"></label><input id="rsCode" class="ltr" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123456"></div>
      <label for="rsPw1" data-i18n="l_newpw"></label><input id="rsPw1" type="password" autocomplete="new-password" class="ltr">
      <label for="rsPw2" data-i18n="l_password2"></label><input id="rsPw2" type="password" autocomplete="new-password" class="ltr">
      <div class="row"><button id="btnRsSave" type="button" data-i18n="b_rs_save"></button></div>
    </div>
    <div class="row">
      <button id="btnLogin" data-i18n="b_login"></button>
      <button id="btnSignup" class="secondary" data-i18n="b_signup"></button>
      <button id="btnBackLogin" class="secondary hidden" data-i18n="b_back_login"></button>
      <button id="btnRsSend" class="hidden" data-i18n="b_rs_send"></button>
    </div>
    <button id="btnForgot" type="button" class="linkbtn" data-i18n="b_forgot"></button>
    <a id="lnkRequest" class="linkbtn" href="./start.html#anfrage" data-i18n="b_request"></a>
    <div id="captchaBox" class="captcha hidden"></div>
    <div id="authMsg" class="msg"></div>
  </section>

  <div id="app" class="hidden">
    <section class="hero">
      <div id="welcome" class="welcome hidden"></div>
      <div class="actions"><span id="whoami" hidden></span>
        <button id="btnInvite" type="button" class="act"><span class="ic">🎁</span><span data-i18n="b_invite_s"></span></button>
        <button id="btnHelp" type="button" class="act"><span class="ic">ℹ️</span><span data-i18n="b_help_s"></span></button>
        <button id="btnBuero" type="button" class="act"><span class="ic">📊</span><span data-i18n="b_buero_s"></span></button>
      </div>
    </section>

    <section id="bizCreate" class="hidden">
      <h2 data-i18n="h_biz_create"></h2>
      <p class="hint" data-i18n="biz_hint"></p>
      <label for="bizName" data-i18n="l_biz_name"></label>

  if (/sum of vat lines/i.test(m)) return e.sum;
  if (/are required/i.test(m)) return e.required;
  if (/extraction is locked/i.test(m)) return e.recorded;

async function sha256Hex(file){

}

$("btnUpload").onclick = async () => {
  const msg = $("upMsg"); hide(msg);
  const file = $("file").files[0];
  if (!file) return show(msg, T().m_no_file, "bad");
  if (file.size > 20 * 1024 * 1024) return show(msg, T().e.big, "bad");
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  const mime = MIME_BY_EXT[ext] || file.type || "";
  if (!ALLOWED.has(mime)) return show(msg, T().e.type, "bad");

  const btn = $("btnUpload"); if (btn.disabled) return; btn.disabled = true;
  // .xml ist immer eine E-Rechnung (XRechnung / ZUGFeRD-XML)
  if (ext === "xml" && $("source").value === "scan") $("source").value = "e_invoice_xml";
  // .zip ist der Taxameter-Export (DSFinV-TW)
  if (ext === "zip" && $("source").value === "scan") $("source").value = "taxameter_export";
  const srcVal = $("source").value;
  stepState = []; drawSteps(stepState);
  let step = 0;
  const mark = (i, s) => { stepState[i] = s; drawSteps(stepState); };
  try {
    mark(0,"run");
    const hash = await sha256Hex(file);
    mark(0,"done"); step = 1; mark(1,"run");

    const { data: dup, error: dupErr } = await withTimeout(sb.from("documents").select("id").eq("business_id", business.id).eq("sha256", hash).limit(1));
    if (dupErr) throw dupErr;
    if (dup.length) throw new Error("duplicate");
    mark(1,"done"); step = 2; mark(2,"run");

    const path = business.id + "/" + crypto.randomUUID() + (ext ? "." + ext : "");
    const { error: upErr } = await withTimeout(sb.storage.from(BUCKET).upload(path, file, { contentType: mime, upsert: false }), 120000);
    if (upErr) throw upErr;
    mark(2,"done"); step = 3; mark(3,"run");

    const { data: doc, error: insErr } = await sb.from("documents").insert({
      business_id: business.id, storage_path: path, file_name: file.name, mime_type: mime,
      file_size_bytes: file.size, sha256: hash, source: srcVal, document_date: $("docDate").value || null
    }).select("id").single();
    if (insErr){ await sb.storage.from(BUCKET).remove([path]); throw insErr; }
    mark(3,"done"); step = 4; mark(4,"run");

    const res = await verify(doc.id);
    mark(4, res === "verified" ? "done" : "fail");
    const wantAI = res === "verified" && canUseAI({ source: srcVal, mime_type: mime });
    const wantTw = res === "verified" && srcVal === "taxameter_export" && /zip/i.test(mime);
    if (res !== "verified") show(msg, T().m_verify_fail + res, "bad");
    else if (wantTw){
      step = 5; mark(5, "run");
      try {
        const r = await callTwImport(doc.id);
        mark(5, r.status === "failed" ? "fail" : "done");
        show(msg, r.status === "failed" ? T().tw.m_failed : T().tw.m_imported, r.status === "ok" ? "ok" : r.status === "failed" ? "bad" : "info");
      } catch (e) { mark(5, "fail"); show(msg, twErrorText(e), "bad"); }
    }
    else if (!wantAI) show(msg, T().m_ok, "ok");
    else {
      step = 5; mark(5, "run");
      try { await callExtract({ id: doc.id, mime_type: mime, storage_path: path }); mark(5, "done"); show(msg, T().m_ok_ai, "ok"); }
      catch (e) { mark(5, "fail"); show(msg, aiErrorText(e), "bad"); }
    }
    $("file").value = ""; $("docDate").value = "";
  } catch (e) {
    mark(step, "fail");
    show(msg, translateError(e), "bad");
  } finally {
    btn.disabled = false;
    await loadDocs();
  }
};

function mk(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function parseCents(s){
  let v = String(s ?? "").replace(/[\s€]/g, "");
  if (!v) return null;
  const neg = v.startsWith("-"); if (neg) v = v.slice(1);
  if (v.includes(",") && v.includes(".")) v = v.replace(/\./g, "").replace(",", ".");
  else if (v.includes(",")) v = v.replace(",", ".");
  else if (/\.\d{3}$/.test(v)) v = v.replace(/\./g, "");
  if (!/^\d{1,9}(\.\d{1,2})?$/.test(v)) return null;
  const [a, b = ""] = v.split(".");
  const c = Number(a) * 100 + Number((b + "00").slice(0, 2));
  return neg ? -c : c;
}
function centsToInput(c){
  if (c == null) return "";
  const neg = c < 0; c = Math.abs(c);
  return (neg ? "-" : "") + Math.floor(c / 100) + "," + String(c % 100).padStart(2, "0");
}

async function shrinkImage(blob, max = 2000){
  const bmp = await createImageBitmap(blob);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const out = await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
  if (!out) throw new Error("encode");
  return await new Promise((res, rej) => {
    const fr = new FileReader();

async function callExtract(d){

  if (d.mime_type.startsWith("image/")){
    const { data: blob, error } = await withTimeout(sb.storage.from(BUCKET).download(d.storage_path), 60000);
    if (error) throw error;
    try { body.image_base64 = await shrinkImage(blob); body.image_media_type = "image/jpeg"; }
    catch (_) { throw { aiCode: "unsupported_format" }; }
  }
  let res;
  try { res = await withTimeout(sb.functions.invoke("extract-document", { body }), 120000); }
  catch (e) { throw (e && e.message === "timeout") ? { aiCode: "ai_timeout" } : e; }
  if (res.error){
    let code = null;
    try { code = (await res.error.context.json()).error; } catch (_) {}
    throw { aiCode: code || "generic", detail: res.error.message };
  }
  return res.data.extraction;
}

/* ---------- E-Rechnung (XRechnung UBL / CII): Lesefassung ----------
   Liest die wichtigsten Angaben aus der XML-Datei. Nur zum Lesen – maßgeblich bleibt die XML-Datei. */
const EINV = (() => {
  const ch = (el, n) => { if (!el) return null; for (const c of el.children) if (c.localName === n) return c; return null; };
  const chs = (el, n) => el ? [...el.children].filter(c => c.localName === n) : [];
  const at = (el, ...path) => { for (const n of path) el = ch(el, n); return el; };
  const tx = (el) => (el && el.textContent || "").trim();
  const num = (el) => { const v = Number(tx(el)); return el && Number.isFinite(v) ? v : null; };
  const cii = (s) => /^\d{8}$/.test(s) ? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}` : s;
  const PAY = { "10":"Bar", "30":"Überweisung", "31":"Überweisung", "42":"Überweisung", "48":"Karte", "54":"Kreditkarte", "55":"Debitkarte",
    "58":"SEPA-Überweisung", "59":"SEPA-Lastschrift" };
  function parse(xmlText){
    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    if (doc.getElementsByTagName("parsererror").length) throw new Error("XML nicht lesbar");
    const r = doc.documentElement, root = r.localName;
    const o = { format: "", kind: "Rechnung", lines: [], taxes: [], seller: {}, buyer: {}, notes: [] };
    if (root === "Invoice" || root === "CreditNote"){
      o.format = "XRechnung (UBL)"; if (root === "CreditNote") o.kind = "Gutschrift";
      o.id = tx(ch(r, "ID")); o.date = tx(ch(r, "IssueDate")); o.due = tx(ch(r, "DueDate"));
      o.currency = tx(ch(r, "DocumentCurrencyCode")) || "EUR";
      chs(r, "Note").forEach(n => o.notes.push(tx(n)));
      const party = (p) => { const q = at(p, "Party"); return {
        name: tx(at(q, "PartyLegalEntity", "RegistrationName")) || tx(at(q, "PartyName", "Name")),
        street: tx(at(q, "PostalAddress", "StreetName")), zip: tx(at(q, "PostalAddress", "PostalZone")), city: tx(at(q, "PostalAddress", "CityName")),
        vat: tx(at(q, "PartyTaxScheme", "CompanyID")) }; };
      o.seller = party(ch(r, "AccountingSupplierParty")); o.buyer = party(ch(r, "AccountingCustomerParty"));
      const pm = ch(r, "PaymentMeans"); o.payCode = tx(ch(pm, "PaymentMeansCode")); o.iban = tx(at(pm, "PayeeFinancialAccount", "ID"));
      o.terms = tx(at(r, "PaymentTerms", "Note"));
      for (const tt of chs(r, "TaxTotal")) for (const s of chs(tt, "TaxSubtotal"))
        o.taxes.push({ rate: num(at(s, "TaxCategory", "Percent")), basis: num(ch(s, "TaxableAmount")), tax: num(ch(s, "TaxAmount")) });
      const m = ch(r, "LegalMonetaryTotal");
      o.net = num(ch(m, "TaxExclusiveAmount")); o.gross = num(ch(m, "TaxInclusiveAmount")); o.payable = num(ch(m, "PayableAmount"));
      for (const l of [...chs(r, "InvoiceLine"), ...chs(r, "CreditNoteLine")])
        o.lines.push({ name: tx(at(l, "Item", "Name")), qty: num(ch(l, "InvoicedQuantity")) ?? num(ch(l, "CreditedQuantity")),
          price: num(at(l, "Price", "PriceAmount")), rate: num(at(l, "Item", "ClassifiedTaxCategory", "Percent")), net: num(ch(l, "LineExtensionAmount")) });
    } else if (root === "CrossIndustryInvoice"){
      o.format = "XRechnung / ZUGFeRD (CII)";
      const ed = ch(r, "ExchangedDocument"); o.id = tx(ch(ed, "ID")); o.date = cii(tx(at(ed, "IssueDateTime", "DateTimeString")));
      if (tx(ch(ed, "TypeCode")) === "381") o.kind = "Gutschrift";
      chs(ed, "IncludedNote").forEach(n => o.notes.push(tx(ch(n, "Content"))));
      const t = ch(r, "SupplyChainTradeTransaction"), ag = ch(t, "ApplicableHeaderTradeAgreement"), st = ch(t, "ApplicableHeaderTradeSettlement");
      const party = (p) => ({ name: tx(ch(p, "Name")), street: tx(at(p, "PostalTradeAddress", "LineOne")),
        zip: tx(at(p, "PostalTradeAddress", "PostcodeCode")), city: tx(at(p, "PostalTradeAddress", "CityName")),
        vat: chs(p, "SpecifiedTaxRegistration").map(x => tx(ch(x, "ID"))).filter(Boolean).join(", ") });
      o.seller = party(ch(ag, "SellerTradeParty")); o.buyer = party(ch(ag, "BuyerTradeParty"));
      o.currency = tx(ch(st, "InvoiceCurrencyCode")) || "EUR";
      const pm = ch(st, "SpecifiedTradeSettlementPaymentMeans"); o.payCode = tx(ch(pm, "TypeCode"));
      o.iban = tx(at(pm, "PayeePartyCreditorFinancialAccount", "IBANID"));
      const pt = ch(st, "SpecifiedTradePaymentTerms"); o.terms = tx(ch(pt, "Description"));
      o.due = cii(tx(at(pt, "DueDateDateTime", "DateTimeString")));
      for (const x of chs(st, "ApplicableTradeTax")) o.taxes.push({ rate: num(ch(x, "RateApplicablePercent")), basis: num(ch(x, "BasisAmount")), tax: num(ch(x, "CalculatedAmount")) });
      const m = ch(st, "SpecifiedTradeSettlementHeaderMonetarySummation");
      o.net = num(ch(m, "TaxBasisTotalAmount")); o.gross = num(ch(m, "GrandTotalAmount")); o.payable = num(ch(m, "DuePayableAmount"));
      for (const l of chs(t, "IncludedSupplyChainTradeLineItem")){
        const ls = ch(l, "SpecifiedLineTradeSettlement");
        o.lines.push({ name: tx(at(l, "SpecifiedTradeProduct", "Name")), qty: num(at(l, "SpecifiedLineTradeDelivery", "BilledQuantity")),
          price: num(at(l, "SpecifiedLineTradeAgreement", "NetPriceProductTradePrice", "ChargeAmount")),
          rate: num(at(ls, "ApplicableTradeTax", "RateApplicablePercent")), net: num(at(ls, "SpecifiedTradeSettlementLineMonetarySummation", "LineTotalAmount")) });
      }
    } else throw new Error("Keine E-Rechnung");
    o.payText = o.payCode ? (PAY[o.payCode] || ("Code " + o.payCode)) : "";
    return o;
  }
  const e = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
  const money = (v, cur) => v == null ? "–" : v.toLocaleString("de-DE", { style: "currency", currency: cur || "EUR" });
  const dmy = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || "") ? `${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(0,4)}` : (s || "");
  const addr = (p) => [p.name, p.street, [p.zip, p.city].filter(Boolean).join(" "), p.vat ? "USt-ID: " + p.vat : ""].filter(Boolean).map(e).join("<br>");
  function html(o){
    const c = o.currency;
    return `<div class="einv" dir="ltr" lang="de">
      <div class="einv-note">Lesefassung der ${e(o.format)} – maßgeblich ist die XML-Datei</div>
      <div class="einv-head"><div><b>${e(o.kind)} ${e(o.id)}</b><br>Datum: ${e(dmy(o.date))}${o.due ? `<br>Fällig: ${e(dmy(o.due))}` : ""}</div>
        <div class="einv-total">${money(o.payable ?? o.gross, c)}</div></div>
      <div class="einv-parties"><div><small>Verkäufer</small><br>${addr(o.seller)}</div><div><small>Käufer</small><br>${addr(o.buyer)}</div></div>
      <div class="einv-scroll"><table class="einv-t"><thead><tr><th>Position</th><th class="r">Menge</th><th class="r">Preis netto</th><th class="r">USt</th><th class="r">Netto</th></tr></thead>
      <tbody>${o.lines.map(l => `<tr><td>${e(l.name)}</td><td class="r">${l.qty ?? ""}</td><td class="r">${money(l.price, c)}</td><td class="r">${l.rate ?? ""} %</td><td class="r">${money(l.net, c)}</td></tr>`).join("")}</tbody></table></div>
      <table class="einv-t einv-sum"><tbody>
        ${o.taxes.map(x => `<tr><td>USt ${x.rate ?? "?"} % auf ${money(x.basis, c)}</td><td class="r">${money(x.tax, c)}</td></tr>`).join("")}
        <tr><td>Summe netto</td><td class="r">${money(o.net, c)}</td></tr>
        <tr class="b"><td>Gesamtbetrag</td><td class="r">${money(o.gross, c)}</td></tr>
      </tbody></table>
      ${o.payText || o.iban || o.terms ? `<p class="einv-pay">Zahlung: ${e([o.payText, o.iban ? "IBAN " + o.iban : "", o.terms].filter(Boolean).join(" · "))}</p>` : ""}
      ${o.notes.filter(Boolean).length ? `<p class="einv-pay">${o.notes.filter(Boolean).map(e).join("<br>")}</p>` : ""}
    </div>`;
  }
  const CSS = `.einv{font-size:14px;display:grid;gap:12px;background:#fff;color:#1d2125;border:1px solid #c9ced3;border-radius:10px;padding:14px;text-align:left}
.einv-note{font-size:12px;background:#fff4d6;color:#6b4e00;border-radius:6px;padding:6px 8px}
.einv-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.einv-total{font-size:20px;font-weight:700}
.einv-parties{display:grid;grid-template-columns:1fr 1fr;gap:12px}.einv-parties small{color:#5f6770}
.einv-scroll{overflow-x:auto}.einv-t{width:100%;border-collapse:collapse}.einv-t th,.einv-t td{padding:5px 6px;border-bottom:1px solid #e3e6e9;text-align:left}
.einv-t th{font-size:12px;color:#5f6770;font-weight:600}.einv-t .r{text-align:right;white-space:nowrap}.einv-sum{max-width:360px;margin-left:auto}.einv-sum tr.b td{font-weight:700;border-bottom:2px solid #1d2125}
.einv-pay{margin:0;font-size:13px;color:#3b4148}@media (max-width:520px){.einv-parties{grid-template-columns:1fr}}`;
  return { parse, html, CSS, money, dmy };
})();

const HELP_CSS = `.helpbox{display:grid;gap:8px}
.helpbox details{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.helpbox summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
.helpbox summary::-webkit-details-marker{display:none}
.helpbox summary::after{content:"▾";color:var(--muted)} .helpbox details[open] summary::after{content:"▴"}
.helpbox ul{margin:0;padding:0 14px 12px;padding-inline-start:32px;display:grid;gap:6px}
.helpbox .hfoot{font-size:.85rem;color:var(--muted);margin:6px 2px 0}`;
function helpHTML(lang){
  const h = HELP[lang] || HELP.de;
  const e = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
  return `<div class="helpbox">${h.s.map(([t, items], i) => `<details${i === 0 ? " open" : ""}><summary>${e(t)}</summary><ul>${items.map(x => `<li>${e(x)}</li>`).join("")}</ul></details>`).join("")}
    <p class="hfoot">${e(h.foot)}</p></div>`;
}

(() => { const st = document.createElement("style"); st.textContent = HELP_CSS; document.head.append(st); })();

      fetch(data.signedUrl).then(r => r.text()).then(x => { box.innerHTML = EINV.html(EINV.parse(x)); })
        .catch(() => { box.textContent = t.viewer_nopreview; });
    } else {
      body.append(mk("p", "hint", t.viewer_nopreview));
    }
    const a = mk("a", "btnlink", t.viewer_open); a.href = data.signedUrl; a.target = "_blank"; a.rel = "noopener";
    body.append(a);
  });
}

let view = "main";

function verifyNoteFor(t, r){
  return r === "verified"
    ? { kind: "ok", text: t.reverify_ok + new Date().toLocaleTimeString(t.locale) }
    : { kind: "bad", text: t.reverify_bad + (t.status[r] || r) };
}

async function loadProtocol(){
  if (!business) return;
  const t = T(), box = $("protoList");
  const [{ data: docs, error: e1 }, { data: integ }, { data: vers }] = await Promise.all([
    sb.from("documents").select("id,file_name,source,uploaded_at,status,erfasst_at,sha256,mime_type,storage_path").eq("business_id", business.id).order("uploaded_at", { ascending: false }),
    sb.from("document_integrity").select("document_id,status").eq("business_id", business.id),
    sb.from("document_verifications").select("document_id,verified_at,matches").order("verified_at", { ascending: false })
  ]);
  box.innerHTML = "";
  if (e1) return box.append(mk("p", "hint", translateError(e1)));
  if (!docs.length) return box.append(mk("p", "hint", t.proto_empty));
  const st = Object.fromEntries((integ || []).map((r) => [r.document_id, r.status]));
  const byDoc = {};
  for (const v of (vers || [])) (byDoc[v.document_id] ||= []).push(v);
  for (const d of docs){
    const s = st[d.id] || "unverified";
    const card = mk("div", "doc");
    const chips = mk("div", "chips");
    chips.append(mk("span", "chip " + s, t.status[s]), mk("span", "chip " + d.status, t.rec[d.status]));
    card.append(mk("div", "name", d.file_name), chips);
    card.append(mk("div", "meta", t.src[d.source] + " | " + t.uploaded + new Date(d.uploaded_at).toLocaleString(t.locale) +
      (d.erfasst_at ? " | " + t.erfasst_on + new Date(d.erfasst_at).toLocaleString(t.locale) : "")));
    card.append(mk("div", "hash ltr", "SHA-256: " + d.sha256));
    const list = byDoc[d.id] || [];
    if (!list.length) card.append(mk("div", "meta", t.never_checked));
    else {
      const recent = list.slice(0, 3).map((v) => new Date(v.verified_at).toLocaleString(t.locale) + " " + (v.matches ? "✓" : "✗")).join(" · ");
      card.append(mk("div", "meta", t.last_checks + recent + (list.length > 3 ? " (" + t.n_checks.replace("{n}", list.length) + ")" : "")));
    }
    const actions = mk("div", "actions");
    const bView = mk("button", "secondary", t.view); bView.onclick = () => openViewer(d);
    const bVer = mk("button", "secondary", t.reverify);
    bVer.onclick = async () => {
      bVer.disabled = true; bVer.textContent = t.reverify_running;
      verifyNote[d.id] = verifyNoteFor(t, await verify(d.id));
      await loadProtocol();
    };
    actions.append(bView, bVer);
    card.append(actions);
    if (verifyNote[d.id]) card.append(mk("div", "msg show " + verifyNote[d.id].kind, verifyNote[d.id].text));
    box.append(card);
  }
}

$("btnVerifyAll").onclick = async () => {
  const btn = $("btnVerifyAll"), msg = $("protoMsg"), t = T();
  if (btn.disabled || !business) return;
  btn.disabled = true;
  const { data: docs } = await sb.from("documents").select("id,file_name").eq("business_id", business.id);
  const all = docs || [], bad = [];
  for (let i = 0; i < all.length; i++){
    show(msg, t.verify_progress.replace("{n}", i + 1).replace("{m}", all.length), "info");
    const r = await verify(all[i].id);
    if (r !== "verified") bad.push(all[i].file_name);
    verifyNote[all[i].id] = verifyNoteFor(t, r);
  }
  btn.disabled = false;
  if (!bad.length) show(msg, t.verify_all_ok.replace("{m}", all.length), "ok");
  else show(msg, t.verify_all_bad.replace("{k}", bad.length).replace("{m}", all.length) + " " + bad.join(", "), "bad");
  await loadProtocol();
};

/* ---------- Vorschaubilder ---------- */
const isPreviewable = (d) => (d.mime_type || "").startsWith("image/") && !/heic|heif/i.test(d.mime_type);
async function signedImageUrls(docs){
  const paths = docs.filter(isPreviewable).map((d) => d.storage_path);
  if (!paths.length) return {};
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(paths, 3600);
  if (error || !data) return {};
  return Object.fromEntries(data.filter((r) => r.signedUrl).map((r) => [r.path, r.signedUrl]));
}
function thumbEl(d){
  const b = mk("button", "thumb"); b.type = "button";
  b.setAttribute("aria-label", T().view + ": " + d.file_name);
  if (d._url){ const im = mk("img"); im.src = d._url; im.alt = ""; im.loading = "lazy"; im.decoding = "async"; b.append(im); }
  else {
    const mt = d.mime_type || "", fn = d.file_name || "";
    b.append(mk("span", "ticon", /pdf/i.test(mt) ? "📄" : /zip/i.test(mt) || /\.zip$/i.test(fn) ? "🗜️" : /xml/i.test(mt) ? "🧾" : /csv/i.test(mt) ? "📊" : "📎"));
  }
  b.onclick = () => openViewer(d);
  return b;
}

function reviewForm(d, x){
  const t = T();
  const isAI = x && x.origin === "ai";
  const unsure = new Set(isAI ? (x.uncertain_fields || []) : []);
  const f = mk("div", "review");
  const head = mk("div", "rhead"); head.append(mk("strong", null, t.h_review)); if (x) head.append(originChip(x.origin)); f.append(head);
  if (d._url){
    const pb = mk("button", "rimg"); pb.type = "button"; pb.title = t.tap_zoom; pb.setAttribute("aria-label", t.tap_zoom);
    const im = mk("img"); im.src = d._url; im.alt = d.file_name; im.loading = "lazy";
    pb.append(im); pb.onclick = () => openViewer(d);
    f.append(pb, mk("p", "hint center", t.tap_zoom));
  }
  if (!d._url && (d.mime_type === "application/xml" || d.mime_type === "text/xml")){
    const bInv = mk("button", "secondary", t.show_invoice); bInv.type = "button"; bInv.onclick = () => openViewer(d); f.append(bInv);
  }
  if (isAI) f.append(mk("p", "hint", t.review_hint));
  if (isAI && x.notes) f.append(mk("p", "hint", t.ai_note + x.notes));
  if (isAI) for (const k of (x.warnings || [])) f.append(mk("div", "warn", t.warn[k] || k));

  // Belegart: betrieblich / privat / gemischt (KI schlägt vor, Mensch entscheidet)
  let kind = x?.receipt_kind || (x?.category === "privat" ? "private" : "business");
  const kWrap = mk("div", "fld"); kWrap.append(mk("label", null, t.k_label));
  const seg = mk("div", "kindseg"); seg.setAttribute("role", "group"); seg.setAttribute("aria-label", t.k_label);
  const kBtns = {};
  for (const k of ["business", "private", "mixed"]){
    const b = mk("button", null, t["k_" + k]); b.type = "button"; kBtns[k] = b;
    b.onclick = () => { kind = k; syncKind(true); };
    seg.append(b);
  }
  kWrap.append(seg);
  const kBox = mk("div", "kbox");
  const mixWrap = mk("div", "grid2");
  const iBiz = (() => { const i = mk("input", "ltr"); i.inputMode = "decimal"; i.placeholder = "0,00"; i.value = centsToInput(x?.business_gross_cents); return i; })();
  const iBizV = (() => { const i = mk("input", "ltr"); i.inputMode = "decimal"; i.placeholder = "0,00"; i.value = centsToInput(x?.business_vat_cents); return i; })();
  const fb = mk("div", "fld"); { const l = mk("label", null, t.f_biz_gross); iBiz.id = "f_biz_" + d.id; l.htmlFor = iBiz.id; fb.append(l, iBiz); }
  const fv = mk("div", "fld"); { const l = mk("label", null, t.f_biz_vat); iBizV.id = "f_bizv_" + d.id; l.htmlFor = iBizV.id; fv.append(l, iBizV); }
  mixWrap.append(fb, fv);
  const bizNames = (x?.line_items || []).filter(i => i.business).map(i => i.name + " " + fmtEUR(i.gross_cents)).join(", ");
  function syncKind(userClick){
    for (const k in kBtns) kBtns[k].setAttribute("aria-pressed", String(k === kind));
    kBox.innerHTML = "";
    const aiSays = isAI && x.receipt_kind === kind;
    if (kind === "private"){
      if (aiSays) kBox.append(mk("div", null, t.ai_private));
      const bDelP = mk("button", "secondary danger", t.b_del_private); bDelP.type = "button";
      bDelP.onclick = async () => {
        if (!confirm(t.del_private_confirm)) return;
        bDelP.disabled = true;
        const { data: path, error } = await sb.rpc("delete_draft_document", { p_document_id: d.id, p_reason: t.del_reason });
        if (error){ show($("upMsg"), translateError(error), "bad"); return loadDocs(); }
        const { error: rmErr } = await sb.storage.from(BUCKET).remove([path]);
        if (rmErr) show($("upMsg"), T().m_file_left + rmErr.message, "info"); else show($("upMsg"), T().m_deleted, "ok");
        openEdit.delete(d.id); delete notice[d.id];
        await loadDocs();
      };
      kBox.append(bDelP, mk("div", "tip", t.tip_separate));
      if (userClick || !sCat.value) sCat.value = "privat";
    } else if (kind === "mixed"){
      if (aiSays) kBox.append(mk("div", null, t.ai_mixed));
      if (bizNames) kBox.append(mk("div", null, t.biz_items + bizNames));
      kBox.append(mixWrap, mk("div", "tip", t.tip_separate));
      if (sCat.value === "privat") sCat.value = "sonstiges_betrieblich";
    } else if (userClick && sCat.value === "privat"){ sCat.value = ""; }
    kBox.classList.toggle("hidden", kind === "business");
  }

  // Gelb markierte (unsichere) Felder müssen einzeln abgehakt werden
  const checks = [];
  let bOk = null, checkHint = null;
  const syncOk = () => {
    const open = checks.some((c) => !c.checked);
    if (bOk) bOk.disabled = open;
    if (checkHint) checkHint.classList.toggle("hidden", !open);
  };
  const addCheck = (wrap, watchEl) => {
    const lab = mk("label", "chk mini");
    const cb = mk("input"); cb.type = "checkbox";
    lab.append(cb, mk("span", null, t.chk_label));
    cb.onchange = () => { wrap.classList.toggle("ok", cb.checked); syncOk(); };
    const mark = () => { if (!cb.checked){ cb.checked = true; wrap.classList.add("ok"); syncOk(); } };
    watchEl.addEventListener("input", mark); watchEl.addEventListener("change", mark);
    checks.push(cb); wrap.append(lab);
  };
  const field = (key, label, input) => {
    const w = mk("div", "fld" + (unsure.has(key) ? " unsure" : ""));
    const id = "f_" + key + "_" + d.id; input.id = id;
    const l = mk("label", null, label); l.htmlFor = id; w.append(l, input);
    if (unsure.has(key)) addCheck(w, input);
    return w;
  };
  const inp = (val, cls) => { const i = mk("input", cls); i.value = val ?? ""; return i; };
  const iDate = inp(x?.document_date, "ltr"); iDate.type = "date";
  const iVendor = inp(x?.vendor_name);
  const iInv = inp(x?.invoice_number, "ltr");
  const sPay = mk("select"); for (const k of Object.keys(t.pay)){ const o = mk("option", null, t.pay[k]); o.value = k; sPay.append(o); }
  sPay.value = x?.payment_method || "unbekannt";
  const sCat = mk("select"); { const o = mk("option", null, "–"); o.value = ""; sCat.append(o); }
  for (const k of Object.keys(t.cat)){ const o = mk("option", null, t.cat[k]); o.value = k; sCat.append(o); }
  sCat.value = x?.category || "";
  const g2 = mk("div", "grid2");
  g2.append(field("document_date", t.f_date, iDate), field("payment_method", t.f_pay, sPay));
  f.append(kWrap, kBox);
  f.append(g2, field("vendor_name", t.f_vendor, iVendor), field("invoice_number", t.f_invno, iInv), field("category", t.f_cat, sCat));
  syncKind(false);

  // Steuerzeilen
  const linesBox = mk("div", "fld" + (unsure.has("vat_lines") || unsure.has("gross_total_cents") ? " unsure" : ""));
  linesBox.append(mk("label", null, t.f_lines));
  const hdr = mk("div", "vline vhead");
  hdr.append(mk("span", null, t.f_rate), mk("span", null, t.f_gross), mk("span", null, t.f_vat), mk("span", null, t.f_net));
  linesBox.append(hdr);
  const rowsBox = mk("div"); linesBox.append(rowsBox);
  const totalEl = mk("div", "total");
  const rows = [];
  const recalc = () => {
    let sum = 0, ok = true;
    for (const r of rows){ const v = r.get(); if (!v) ok = false; else sum += v.gross_cents; }
    totalEl.textContent = t.f_total + ": " + (ok && rows.length ? fmtEUR(sum) : "–");
  };
  const addRow = (l) => {
    const row = mk("div", "vline");
    const sRate = mk("select", "ltr");
    const rates = [19, 7, 0]; if (l && !rates.includes(Number(l.rate))) rates.push(Number(l.rate));
    for (const r of rates){ const o = mk("option", null, r + " %"); o.value = String(r); sRate.append(o); }
    sRate.value = String(l ? Number(l.rate) : 19);
    const iG = inp(centsToInput(l?.gross_cents), "ltr"); iG.inputMode = "decimal"; iG.placeholder = "0,00"; iG.setAttribute("aria-label", t.f_gross);
    const iV = inp(centsToInput(l?.vat_cents), "ltr"); iV.inputMode = "decimal"; iV.placeholder = "0,00"; iV.setAttribute("aria-label", t.f_vat);
    iV.dataset.auto = l ? "0" : "1";
    const net = mk("span", "net ltr", "–");
    const bRm = mk("button", "secondary small", "×"); bRm.type = "button"; bRm.title = t.b_rmline; bRm.setAttribute("aria-label", t.b_rmline);
    const lw = mk("div", "lwarn");
    const obj = {
      get(){
        const g = parseCents(iG.value), v = parseCents(iV.value), r = Number(sRate.value);
        return g == null || v == null ? null : { rate: r, gross_cents: g, vat_cents: v, net_cents: g - v };
      }
    };
    const upd = () => {
      const g = parseCents(iG.value), r = Number(sRate.value);
      if (iV.dataset.auto === "1" && g != null) iV.value = centsToInput(Math.round(g * r / (100 + r)));
      const v = parseCents(iV.value);
      net.textContent = (g != null && v != null) ? fmtEUR(g - v) : "–";
      lw.textContent = (g != null && v != null && Math.abs(v - Math.round((g - v) * r / 100)) > 2) ? t.live_vat : "";
      recalc();
    };
    iG.oninput = upd; sRate.onchange = upd;
    iV.oninput = () => { iV.dataset.auto = "0"; upd(); };
    bRm.onclick = () => { if (rows.length <= 1) return; rows.splice(rows.indexOf(obj), 1); row.remove(); lw.remove(); recalc(); };
    row.append(sRate, iG, iV, net, bRm);
    rowsBox.append(row, lw);
    rows.push(obj); upd();
  };
  const initLines = x?.vat_lines?.length ? x.vat_lines : [null];
  initLines.forEach(addRow);
  const bAdd = mk("button", "secondary small", "+ " + t.b_addline); bAdd.type = "button";
  bAdd.onclick = () => { if (rows.length < 5) addRow(null); };
  linesBox.append(bAdd, totalEl);
  if (unsure.has("vat_lines") || unsure.has("gross_total_cents")) addCheck(linesBox, rowsBox);
  f.append(linesBox);
  if (isAI && x.gross_total_cents != null) f.append(mk("p", "hint", t.ai_total + fmtEUR(x.gross_total_cents)));

  const msg = mk("div", "msg");
  const btns = mk("div", "actions");
  bOk = mk("button", null, t.b_confirm); bOk.type = "button";
  bOk.onclick = async () => {
    hide(msg);
    const lines = rows.map(r => r.get());
    if (lines.some(l => !l)) return show(msg, t.e.amount, "bad");
    if (!iDate.value || !sCat.value || !sPay.value || !lines.length) return show(msg, t.e.required, "bad");
    const total = lines.reduce((a, l) => a + l.gross_cents, 0);
    let bizG = null, bizV = null;
    if (kind === "private" && sCat.value !== "privat") return show(msg, t.e_private_cat, "bad");
    if (kind === "mixed"){
      if (sCat.value === "privat") return show(msg, t.e_mixed_cat, "bad");
      bizG = parseCents(iBiz.value); bizV = parseCents(iBizV.value) ?? 0;
      if (bizG == null || bizG <= 0 || bizG > total || bizV < 0 || bizV > bizG) return show(msg, t.e_mixed, "bad");
    }
    if (kind === "business" && sCat.value === "privat") kind = "private";
    bOk.disabled = true;
    const { data, error } = await sb.rpc("confirm_extraction", { p_document_id: d.id, p_data: {
      document_date: iDate.value, vendor_name: iVendor.value, invoice_number: iInv.value,
      payment_method: sPay.value, category: sCat.value, gross_total_cents: total, vat_lines: lines,
      receipt_kind: kind, business_gross_cents: bizG, business_vat_cents: bizV, line_items: x?.line_items || null } });
    bOk.disabled = false;
    if (error) return show(msg, translateError(error), "bad");
    openEdit.delete(d.id);
    notice[d.id] = { text: t.m_confirmed, kind: (data.warnings || []).length ? "info" : "ok" };
    await loadDocs();
  };
  btns.append(bOk);
  if (canUseAI(d)){
    const bRe = mk("button", "secondary", t.b_reextract); bRe.type = "button";
    bRe.onclick = async () => {
      bRe.disabled = true; bRe.textContent = t.m_extracting;
      try { await callExtract(d); openEdit.delete(d.id); delete notice[d.id]; }
      catch (e) { notice[d.id] = { text: aiErrorText(e), kind: "bad" }; }
      await loadDocs();
    };
    btns.append(bRe);
  }
  if (openEdit.has(d.id)){
    const bC = mk("button", "secondary", t.b_cancel); bC.type = "button";
    bC.onclick = () => { openEdit.delete(d.id); loadDocs(); };
    btns.append(bC);
  }
  checkHint = mk("p", "hint warn-text", t.need_checks);
  f.append(checkHint, btns, msg);
  syncOk();
  return f;
}

/* ---------- List ---------- */
async function loadDocs(){
  if (!business) return;
  const t = T();
  const [{ data: docs, error: e1 }, { data: integ, error: e2 }, { data: exts, error: e3 }, { data: imps }] = await Promise.all([
    sb.from("documents").select("id,file_name,source,document_date,uploaded_at,storage_path,sha256,status,erfasst_at,mime_type").eq("business_id", business.id).order("uploaded_at", { ascending: false }),
    sb.from("document_integrity").select("document_id,status").eq("business_id", business.id),
    sb.from("document_latest_extraction").select("*"),
    sb.from("tw_latest_import").select("*").eq("business_id", business.id)
  ]);
  // Übergebene (in einem Steuerberater-Paket) und stornierte Belege: nur ausblenden, nie löschen
  const [pk, so] = await Promise.all([
    sb.from("stb_packages").select("period_label,package_no,document_ids,late_document_ids,created_at").eq("business_id", business.id).order("created_at"),
    sb.from("document_stornos").select("document_id").eq("business_id", business.id)
  ]);
  const inPkg = {};
  for (const p of (pk.data || [])) for (const id of [...(p.document_ids || []), ...(p.late_document_ids || [])]) inPkg[id] = p.period_label + " · " + T().done_pkg + " " + p.package_no;
  const stornoed = new Set((so.data || []).map(r => r.document_id));
  loadDeletions(); loadTwMonths();
  const box = $("docs"); box.innerHTML = "";
  const hint = (text) => box.append(mk("p", "hint", text));
  if (e1 || e2 || e3) return hint(translateError(e1 || e2 || e3));
  if (!docs.length) return hint(t.docs_empty);
  const status = Object.fromEntries(integ.map(r => [r.document_id, r.status]));
  const urls = await signedImageUrls(docs);
  const ext = Object.fromEntries((exts || []).map(x => [x.document_id, x]));
  const twImp = Object.fromEntries((imps || []).map(x => [x.document_id, x]));
  docs.sort((a, b) => (a.status === "entwurf" ? 0 : 1) - (b.status === "entwurf" ? 0 : 1));
  const doneBox = mk("details", "done"), doneList = mk("div", "donelist"); let nDone = 0, nOpen = 0;
  for (const d of docs){
    const isDone = d.status !== "entwurf" && (stornoed.has(d.id) || !!inPkg[d.id]);
    const isDraft = d.status === "entwurf";
    const s = status[d.id] || "unverified";
    const x = ext[d.id];
    const card = mk("div", "doc");
    const chips = mk("div", "chips");
    chips.append(mk("span", "chip " + s, t.status[s]), mk("span", "chip " + d.status, t.rec[d.status]));
    if (stornoed.has(d.id)) chips.append(mk("span", "chip storno", t.done_storno));
    else if (inPkg[d.id]) chips.append(mk("span", "chip pkg", "📦 " + inPkg[d.id]));
    const meta = mk("div", "meta", t.src[d.source] + " | " + t.uploaded + new Date(d.uploaded_at).toLocaleString(t.locale) +
      (d.document_date ? " | " + t.docdate + d.document_date : "") +
      (d.erfasst_at ? " | " + t.erfasst_on + new Date(d.erfasst_at).toLocaleString(t.locale) : ""));
    const actions = mk("div", "actions");
    const bView = mk("button", "secondary", t.view);
    bView.onclick = () => openViewer(d);
    actions.append(bView);
    d._url = urls[d.storage_path] || null;
    const dhead = mk("div", "dhead"), dinfo = mk("div", "dinfo");
    dinfo.append(mk("div", "name", d.file_name), chips, meta);
    dhead.append(thumbEl(d), dinfo);
    const parts = [dhead];

    const editing = isDraft && needsData(d) && (openEdit.has(d.id) || (x && x.origin === "ai"));
    if (x && !editing) parts.push(summaryEl(x));
    const imp = twImp[d.id];
    if (d.source === "taxameter_export" && imp) parts.push(twCard(imp));

    if (isDraft){
      if (Date.now() - new Date(d.uploaded_at).getTime() > 10 * 864e5) parts.push(mk("div", "warn", t.overdue));
      if (needsData(d)){
        if (editing) parts.push(reviewForm(d, x));
        else if (!x){
          const row = mk("div", "actions");
          if (canUseAI(d)){
            const bAI = mk("button", "ai", t.b_extract);
            bAI.onclick = async () => {
              bAI.disabled = true; bAI.textContent = t.m_extracting; delete notice[d.id];
              try { await callExtract(d); } catch (e) { notice[d.id] = { text: aiErrorText(e), kind: "bad" }; }
              await loadDocs();
            };
            row.append(bAI);
          }
          const bMan = mk("button", "secondary", t.b_manual);
          bMan.onclick = () => { openEdit.add(d.id); loadDocs(); };
          row.append(bMan);
          parts.push(row);
        } else {
          const bEd = mk("button", "secondary", t.b_edit);
          bEd.onclick = () => { openEdit.add(d.id); delete notice[d.id]; loadDocs(); };
          const row = mk("div", "actions"); row.append(bEd); parts.push(row);
        }
      }
      if (d.source === "taxameter_export"){
        if (isTwDoc(d)){
          const row = mk("div", "actions");
          const bI = mk("button", imp ? "secondary" : "ai", imp ? t.tw.b_reimport : t.tw.b_import);
          bI.onclick = async () => {
            bI.disabled = true; bI.textContent = t.tw.m_importing; delete notice[d.id];
            try { await callTwImport(d.id); } catch (e) { notice[d.id] = { text: twErrorText(e), kind: "bad" }; }
            await loadDocs();
          };
          row.append(bI); parts.push(row);
        } else parts.push(mk("div", "warn", t.tw.err.zip_required));
      }
      if (notice[d.id]){ const n = mk("div", "msg show " + notice[d.id].kind, notice[d.id].text); parts.push(n); }

      const needConfirm = needsData(d) && (!x || x.origin !== "user" || editing);
      const needImport = d.source === "taxameter_export" && (!imp || imp.status === "failed");
      const bErf = mk("button", "record", t.b_erfassen);
      bErf.disabled = s !== "verified" || needConfirm || needImport;
      bErf.onclick = async () => {
        if (!confirm(T().confirm_erfassen)) return;
        bErf.disabled = true;
        const { error } = await sb.rpc("erfassen_document", { p_document_id: d.id });
        notice[d.id] = error ? { text: translateError(error), kind: "bad" } : null;
        if (!error) show($("upMsg"), T().m_erfasst, "ok");
        await loadDocs();
      };
      parts.push(bErf);
      if (needConfirm && s === "verified") parts.push(mk("p", "hint", t.need_confirm));
      if (needImport && s === "verified") parts.push(mk("p", "hint", t.tw.need_import));
      const bDel = mk("button", "secondary danger", t.b_delete);
      bDel.onclick = async () => {
        if (!confirm(T().confirm_delete)) return;
        const reason = prompt(T().reason_prompt, "");
        if (reason === null) return;
        bDel.disabled = true;
        const { data: path, error } = await sb.rpc("delete_draft_document", { p_document_id: d.id, p_reason: reason });
        if (error){ show($("upMsg"), translateError(error), "bad"); return loadDocs(); }
        const { error: rmErr } = await sb.storage.from(BUCKET).remove([path]);
        if (rmErr) show($("upMsg"), T().m_file_left + rmErr.message, "info"); else show($("upMsg"), T().m_deleted, "ok");
        openEdit.delete(d.id); delete notice[d.id];
        await loadDocs();
      };
      actions.append(bDel);
    }
    parts.push(actions);
    card.append(...parts);
    if (isDone){ doneList.append(card); nDone++; } else { box.append(card); nOpen++; }
  }
  if (!nOpen) hint(t.all_done);
  if (nDone){
    const sum = mk("summary", "", t.done_h + " (" + nDone + ")");
    doneBox.append(sum, doneList);
    box.append(doneBox);
  }
}

applyLang();
</script>
</body>
</html>
